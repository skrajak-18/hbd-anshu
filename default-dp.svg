<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="50%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffb6c1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff69b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Ambient halo -->
  <circle cx="250" cy="230" r="180" fill="url(#halo)"/>

  <!-- Decorative sparkling stars -->
  <g fill="#ffffff" opacity="0.8">
    <path d="M 120 100 Q 120 120 140 120 Q 120 120 120 140 Q 120 120 100 120 Q 120 120 120 100 Z" />
    <path d="M 380 90 Q 380 110 400 110 Q 380 110 380 130 Q 380 110 360 110 Q 380 110 380 90 Z" />
    <path d="M 80 340 Q 80 355 95 355 Q 80 355 80 370 Q 80 355 65 355 Q 80 355 80 340 Z" />
    <path d="M 420 320 Q 420 335 435 335 Q 420 335 420 350 Q 420 335 405 335 Q 420 335 420 320 Z" />
  </g>

  <!-- Crown / Tiara for the Birthday Queen -->
  <g transform="translate(200, 105) scale(0.5)" filter="url(#glow)">
    <path d="M 20 80 L 40 20 L 70 60 L 100 0 L 130 60 L 160 20 L 180 80 Z" fill="#ffd700" stroke="#fff" stroke-width="3"/>
    <circle cx="100" cy="5" r="7" fill="#ff4081"/>
    <circle cx="40" cy="23" r="5" fill="#00e5ff"/>
    <circle cx="160" cy="23" r="5" fill="#00e5ff"/>
  </g>

  <!-- Silhouette of Queen / Dreamy Portrait -->
  <g fill="#ffffff">
    <!-- Hair flowing -->
    <path d="M 250 140 C 200 140 170 190 170 260 C 170 320 185 360 190 400 C 210 390 230 380 250 380 C 270 380 290 390 310 400 C 315 360 330 320 330 260 C 330 190 300 140 250 140 Z" opacity="0.3"/>
    <!-- Head -->
    <circle cx="250" cy="215" r="48" fill="#fff" opacity="0.95"/>
    <!-- Gentle facial feature silhouette / profile grace -->
    <!-- Torso / Dress -->
    <path d="M 200 370 C 200 300 220 270 250 270 C 280 270 300 300 300 370 C 280 380 220 380 200 370 Z" fill="#fff" opacity="0.95"/>
    <!-- Shoulders / Flowing dress -->
    <path d="M 160 460 C 170 370 210 350 250 350 C 290 350 330 370 340 460 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Golden floral wreath around profile -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="8 6" filter="url(#glow)"/>
  
  <!-- Elegant Name ribbon -->
  <g transform="translate(100, 420)">
    <rect width="300" height="48" rx="24" fill="rgba(255, 255, 255, 0.25)" stroke="#fff" stroke-width="1.5" backdrop-filter="blur(10px)"/>
    <text x="150" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">✨ ANSHU ✨</text>
  </g>
</svg>
