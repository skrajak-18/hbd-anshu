<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="c1g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/><stop offset="100%" stop-color="#fecfef"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#c1g)"/>
  <!-- Classroom Nostalgia & Two Desk Smiles -->
  <circle cx="200" cy="180" r="110" fill="rgba(255,255,255,0.4)"/>
  <!-- School blackboard / bench silhouette -->
  <rect x="110" y="90" width="180" height="110" rx="10" fill="#2b4c3f" stroke="#e0c39e" stroke-width="6"/>
  <text x="200" y="145" font-family="'Segoe UI', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">Class 10 Memories</text>
  <text x="200" y="175" font-family="'Segoe UI', sans-serif" font-size="13" fill="#ffe082" text-anchor="middle">Where it all started ✨</text>
  <!-- Two little smiling paper planes flying -->
  <path d="M 90 280 L 150 250 L 120 270 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 310 260 L 250 230 L 280 250 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Heart between them -->
  <path d="M 200 280 C 200 250, 160 250, 160 280 C 160 300, 200 330, 200 340 C 200 330, 240 300, 240 280 C 240 250, 200 250, 200 280 Z" fill="#ff4081"/>
  <text x="200" y="375" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6d214f" text-anchor="middle" font-weight="bold">Classmate Days to Today 🌸</text>
</svg>
